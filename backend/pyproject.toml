[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = "^0.116.2"
uvicorn = "^0.35.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^14.0.1"}
pydantic = "^2.11.9"
pydantic-settings = "^2.10.1"
asyncpg = "^0.30.0"
sqlalchemy = {extras = ["async"], version = "^2.0.43"}

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
alembic = "^1.16.5"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | \.mypy_cache
  | build
  | dist
)/
'''

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
